<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Lembar 03: rak proyek dengan tiga unit proyek terpasang, satu unit latihan, dan satu unit kosong">
  <rect width="1000" height="470" fill="#e9eef3"/>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
