      <rect x="148" y="238" width="704" height="48" rx="2" fill="#14202a" stroke="#3a4a57"/>
      <path d="M148 239h704" stroke="#3a4a57" stroke-width="1" opacity="0.6"/>
      <circle cx="170" cy="262" r="3.5" fill="#c6361f"/>
      <text x="192" y="268" font-size="16" letter-spacing="0.8" fill="#d5e0ea">WEB-02</text>
      <text x="828" y="268" text-anchor="end" font-size="13" fill="#93a6b8">halaman</text>
