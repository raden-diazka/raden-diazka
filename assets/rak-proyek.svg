    <g>
      <text x="132" y="322" text-anchor="middle" font-size="10.5" fill="#93a6b8">2U</text>
      <circle cx="132" cy="298" r="1.8" fill="#46596a"/>
      <circle cx="868" cy="298" r="1.8" fill="#46596a"/>
      <circle cx="132" cy="344" r="1.8" fill="#46596a"/>
