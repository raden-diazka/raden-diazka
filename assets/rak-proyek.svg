      <rect x="148" y="292" width="704" height="48" rx="2" fill="#14202a" stroke="#3a4a57"/>
      <path d="M148 293h704" stroke="#3a4a57" stroke-width="1" opacity="0.6"/>
      <circle cx="170" cy="316" r="3.5" fill="#8a5d4e"/>
      <text x="192" y="322" font-size="16" letter-spacing="0.8" fill="#d5e0ea">LAB-01</text>
      <text x="828" y="322" text-anchor="end" font-size="13" fill="#93a6b8">latihan</text>
    </g>

    <!-- 1U: kosong -->
    <g>
      <text x="132" y="376" text-anchor="middle" font-size="10.5" fill="#93a6b8">1U</text>
      <circle cx="132" cy="352" r="1.8" fill="#46596a"/>
      <circle cx="868" cy="352" r="1.8" fill="#46596a"/>
