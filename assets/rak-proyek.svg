  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
    <text x="120" y="430" font-size="10.5" letter-spacing="1.6" fill="#55697a">RAK 19 INCI, 5U</text>
    <circle cx="124" cy="456" r="4" fill="#c6361f"/>
    <text x="140" y="461" font-size="13" fill="#55697a">LED berkedip menandai proyek dengan demo yang bisa dibuka</text>
  </g>
